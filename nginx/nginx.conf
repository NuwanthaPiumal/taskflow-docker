events {}

http {
    # "api" resolves to ALL replicas of the api service via Docker's
    # embedded DNS -- this is what makes scaling + load balancing work.
    upstream api_backend {
        server api:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
